name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    # ubuntu-latest now points to Ubuntu 26.04, which actions/python-versions
    # no longer ships Python 3.9 for; pin that matrix leg to ubuntu-24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ['3.9', '3.14']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - name: Upgrade pip, setuptools, and packaging
      run: |
        python -m pip install --upgrade pip setuptools packaging

    - name: Cache src directory
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/src/
        key: ${{ runner.os }}-src-grch37
        restore-keys: |
          ${{ runner.os }}-src-

    - name: Download GRCh37.tar.gz if not present
      run: |
        if [ ! -f ${{ github.workspace }}/src/GRCh37.tar.gz ]; then
          wget --connect-timeout=10 --tries=20 ftp://alexandrovlab-ftp.ucsd.edu/pub/tools/SigProfilerMatrixGenerator/GRCh37.tar.gz -P ${{ github.workspace }}/src/
        fi

    - name: Install package with tests
      run: |
        pip install .[tests]

    - name: Install genome
      run: |
        SigProfilerMatrixGenerator install GRCh37 --local_genome ${{ github.workspace }}/src/

    - name: Run unit tests
      run: |
        pip install pytest
        pytest -s -rw tests

    - name: Run integration test
      run: |
        python3 test.py

  min-deps:
    # oldest supported Python with every dependency pinned to the lower bound declared in
    # setup.py, to check that the declared minimums install together and pass the tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Upgrade pip, setuptools, and packaging
      run: |
        python -m pip install --upgrade pip setuptools packaging

    - name: Pin dependencies to their declared lower bounds
      run: |
        python - > min-constraints.txt <<'PYEOF'
        import ast, re
        tree = ast.parse(open("setup.py").read())
        reqs = next(node.value for node in ast.walk(tree) if isinstance(node, ast.Assign)
                    and any(getattr(t, "id", None) == "requirements" for t in node.targets))
        for req in ast.literal_eval(reqs):
            m = re.match(r"^([A-Za-z0-9_.-]+).*?>=\s*([0-9][0-9.]*)", req)
            if m:
                print("{}=={}".format(m.group(1), m.group(2)))
        PYEOF
        cat min-constraints.txt

    - name: Install package at the minimum versions
      run: |
        pip install -c min-constraints.txt .[tests]
        pip install pytest
        pip check

    - name: Run unit tests
      run: |
        pytest -rw tests
